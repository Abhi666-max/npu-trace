<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>iQOO Sensor Node</title>
    <style>
        body {
            background-color: #050505;
            color: #ededed;
            font-family: monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }
        .hud {
            border: 1px solid #FBBF24;
            padding: 30px;
            background: rgba(251, 191, 36, 0.05);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.2);
            width: 100%;
            max-width: 300px;
        }
        h1 { color: #FBBF24; font-size: 24px; text-transform: uppercase; margin-bottom: 5px; }
        p { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
        .data { font-size: 32px; font-weight: bold; margin: 20px 0; color: #fff; }
        .btn {
            background: #FBBF24;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .status { margin-top: 20px; font-size: 10px; color: #34d399; }
    </style>
</head>
<body>
    <div class="hud">
        <h1>NPU Trace</h1>
        <p>Telemetry Node</p>
        
        <div id="status" class="status">Connecting to Uplink...</div>
        
        <div class="data" id="npu">NPU: --%</div>
        <div class="data" id="temp">TMP: --°C</div>
        
        <button class="btn" id="stress" onclick="triggerStress()">Spike NPU Load</button>
        <button class="btn" id="disconnect" style="background: #ef4444; margin-top: 10px;" onclick="disconnectNode()">Disconnect Uplink</button>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const npuEl = document.getElementById('npu');
        const tempEl = document.getElementById('temp');
        
        let baselineNpu = 20;
        let baselineTemp = 35;
        let isStress = false;
        let ws;
        let intentionallyDisconnected = false;
        
        // --- THE TOP-NOTCH HACK: WEB WORKER FOR BACKGROUND EXECUTION ---
        // Browsers pause main-thread setIntervals when minimized. 
        // A Web Worker runs in a separate background thread!
        const workerCode = `
            let timer;
            self.onmessage = function(e) {
                if (e.data === 'start') {
                    timer = setInterval(() => self.postMessage('tick'), 1000);
                } else if (e.data === 'stop') {
                    clearInterval(timer);
                }
            };
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const timerWorker = new Worker(URL.createObjectURL(blob));

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        function connect() {
            if (intentionallyDisconnected) return;
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/telemetry`);
            
            ws.onopen = () => {
                statusEl.innerText = "UPLINK ESTABLISHED";
                statusEl.style.color = "#FBBF24";
                const discBtn = document.getElementById('disconnect');
                if(discBtn) discBtn.style.display = 'block';
                requestWakeLock();
                
                timerWorker.postMessage('stop'); // Reset if existing
                timerWorker.postMessage('start');
            };
            
            timerWorker.onmessage = () => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                
                let npu = isStress ? 95 + Math.random() * 5 : baselineNpu + Math.random() * 10;
                let temp = isStress ? 85 + Math.random() * 5 : baselineTemp + Math.random() * 5;
                let latency = isStress ? 45 + Math.random() * 10 : 12 + Math.random() * 3;
                let battery = isStress ? -800 : -200;
                
                npuEl.innerText = `NPU: ${npu.toFixed(1)}%`;
                tempEl.innerText = `TMP: ${temp.toFixed(1)}°C`;
                
                ws.send(JSON.stringify({
                    timestamp: Date.now(),
                    npu_load_pct: npu,
                    token_latency_ms: latency,
                    chip_temp_celsius: temp,
                    battery_drain_ma: battery
                }));
            };
            
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === "command" && msg.data === "STRESS_TEST") {
                        isStress = true;
                        setTimeout(() => { isStress = false; }, 5000);
                    }
                } catch(e) {}
            };
            
            ws.onclose = () => {
                timerWorker.postMessage('stop');
                if (intentionallyDisconnected) {
                    statusEl.innerText = "DISCONNECTED BY USER";
                    statusEl.style.color = "#888";
                } else {
                    statusEl.innerText = "SIGNAL LOST... RECONNECTING";
                    statusEl.style.color = "#dc2626";
                    setTimeout(connect, 2000);
                }
                const discBtn = document.getElementById('disconnect');
                if(discBtn) discBtn.style.display = 'none';
            };
        }

        connect();
        
        window.triggerStress = () => {
            isStress = true;
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: "TRIGGER_STRESS_TEST" }));
            }
            setTimeout(() => { isStress = false; }, 5000);
        };

        window.disconnectNode = () => {
            intentionallyDisconnected = true;
            if (ws) ws.close();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !intentionallyDisconnected) {
                requestWakeLock();
                if (!ws || ws.readyState === WebSocket.CLOSED) {
                    connect();
                }
            }
        });
    </script>
</body>
</html>
